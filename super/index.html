<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super GSD Consultants</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#scr{image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #pad{position:fixed;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;font:700 15px system-ui;display:flex;align-items:center;justify-content:center}
  #stick{left:22px;bottom:22px;width:132px;height:132px}
  #knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
  #jump{right:22px;bottom:30px;width:88px;height:88px}
  #run{right:122px;bottom:40px;width:66px;height:66px;font-size:12px}
  #fire{right:40px;bottom:132px;width:62px;height:62px;font-size:12px;background:rgba(234,88,12,.45);border-color:#fb923c}
  #run.on{background:rgba(250,204,21,.55);border-color:#facc15;color:#111}
  @media (orientation:portrait){#wrap{align-items:flex-start;padding-top:10px}}
  @media (orientation:landscape) and (max-height:600px){#stick{left:max(14px,env(safe-area-inset-left));bottom:14px} #jump{right:max(14px,env(safe-area-inset-right));bottom:20px} #run{right:max(112px,calc(env(safe-area-inset-right) + 98px));bottom:118px} #fire{right:max(14px,env(safe-area-inset-right));bottom:122px}}
  #back{position:fixed;left:8px;top:8px;color:#cbd5e1;font:600 12px system-ui;text-decoration:none;opacity:.7}
</style>
</head>

    else if (e.k === 'pts') txt(String(e.v), x, e.y - e.t * .5, '#fff');
    else if (e.k === 'msg') txt(e.s, x, e.y - e.t * .3, '#fde68a');
    else if (e.k === 'bump') { const t = tileAt(e.tx, e.ty); if (t === 'B' || t === 'M') { const lift = Math.sin(e.t / 10 * Math.PI) * 4; g.fillStyle = PAL[palName].sky; g.fillRect(e.tx * 16 - G.camX, e.ty * 16, 16, 16); g.drawImage(metaCanvas('B', palName), Math.round(e.tx * 16 - G.camX), Math.round(e.ty * 16 - lift)); } }
  }
}
function drawHUD() {
  txt(HERO[G.who].name, 16, 8); txt(String(G.score).padStart(6, '0'), 16, 17);
  txt('$x' + String(G.coins).padStart(2, '0'), 88, 17, '#facc15');
  txt('DEAL', 140, 8); txt(LEVELS[G.lvl].name, 144, 17);
  txt('TIME', 208, 8); if (G.mode !== 'select') txt(String(Math.max(0, G.time)).padStart(3, '0'), 212, 17);
}
function drawSelect(t) {
  g.fillStyle = '#101830'; g.fillRect(0, 0, 256, 240); g.fillStyle = '#1e3a5f'; g.fillRect(0, 192, 256, 48);
  txt('SUPER', 128, 32, '#fde68a', 'center'); txt('GSD CONSULTANTS', 128, 44, '#facc15', 'center', 2);
  txt('CHOOSE YOUR CONSULTANT', 128, 84, '#fff', 'center');
  ['sean', 'kat'].forEach((who, i) => {
    const x = 72 + i * 112, sel = G.pick === i, sp = heroCanvas(who, Math.floor(t / 250) % 2 && sel ? 'walk1' : 'stand');
    g.drawImage(sp, x - 16, 120, 32, 32); txt(HERO[who].name, x, 158, sel ? '#facc15' : '#94a3b8', 'center');
    if (sel) { g.strokeStyle = '#facc15'; g.strokeRect(x - 26, 112, 52, 60); }
  });
  txt(isTouch ? 'STICK TO PICK - JUMP TO START' : 'A / D PICK - SPACE START', 128, 202, '#cbd5e1', 'center');
  txt(isTouch ? 'SPRINT TOGGLES RUN - STICK DOWN - ELEVATOR' : 'HOLD M SPRINT - TAP M FIRE - S ELEVATOR', 128, 214, '#94a3b8', 'center');
}
function render(t) {
  if (G.mode === 'select') return drawSelect(t);
  const L = LEVELS[G.lvl], palName = CUR && CUR.bonus ? CUR.pal : L.pal, pal = PAL[palName];
  if (G.mode === 'intro' || G.mode === 'over') {
    g.fillStyle = '#000'; g.fillRect(0, 0, 256, 240); drawHUD();
    if (G.mode === 'over') txt('GAME OVER', 128, 112, '#fff', 'center');
    else { txt('DEAL ' + L.name, 128, 92, '#fff', 'center'); g.drawImage(heroCanvas(G.who, 'stand', false, false), 100, 112); txt('x ' + G.lives, 124, 116, '#fff'); if (G.msg) { txt(G.msg, 128, 150, '#fde68a', 'center'); } }
    return;
  }
  G.msg = '';
  g.fillStyle = pal.sky; g.fillRect(0, 0, 256, 240);
  drawDeco(pal, G.camX); drawHQ(palName); drawTiles(palName); for (const E of ELEVS) if (E.warp) txt('WARP', E.x * 16 + 16 - G.camX, E.row * 16 - 36, '#fde68a', 'center'); drawLifts(); drawFlag(palName); drawItems(); drawFoes(); drawBars(); drawFX(palName); drawPlayer(); drawHUD();
  if (P.goal === 3 && G.time <= 0) txt(L.boss ? 'AUDIT PASSED - DEAL CLOSED!' : 'DEAL CLOSED!', 128, 96, '#facc15', 'center');
  if (G.rewardT > 0) { G.rewardT--; txt(G.reward, 128, 110, '#86efac', 'center'); }
}

// ---------------------------------------------------------------- fit + fixed 60 Hz loop
function fit() {
  const s = Math.min(innerWidth / 256, innerHeight / 240), k = Math.floor(s), use = k >= 2 && k / s > .85 ? k : s;
  cv.style.width = Math.round(256 * use) + 'px'; cv.style.height = Math.round(240 * use) + 'px';
}
addEventListener('resize', fit); fit();
let lastWH = ''; setInterval(() => { const k = innerWidth + 'x' + innerHeight; if (k !== lastWH) { lastWH = k; fit(); } }, 400);
let last = performance.now(), acc = 0;
function loop(now) { acc += Math.min(250, now - last); last = now; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } render(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

</script>
