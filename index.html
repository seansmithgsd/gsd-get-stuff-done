<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>GSD: Get Stuff Done</title>
<meta name="description" content="Win puzzles, recruit AI workers, build your village. A GSD Consultants game.">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header id="top">
  <div class="brand">GSD<span>: Get Stuff Done</span></div>
  <div id="res"></div>
</header>

<main>
  <section id="v-village" class="view active">
    <canvas id="map"></canvas>
    <div id="hint"></div>
  </section>

  <section id="v-puzzle" class="view">
    <div id="pz-head"></div>
    <div id="pz-wrap"><canvas id="board"></canvas><aside id="pz-legend"></aside></div>
    <div id="pz-foot"></div>
  </section>

  <section id="v-build" class="view panel"></section>
  <section id="v-workers" class="view panel"></section>
</main>

<nav id="tabs">
  <button data-v="village" class="on">Village</button>
  <button data-v="puzzle">Puzzle</button>
  <button data-v="build">Build</button>
  <button data-v="workers">Workers</button>
</nav>

<div id="sheet" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script src="game.js?v=9"></script>
</body>
</html>
